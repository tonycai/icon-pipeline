name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck imagemagick librsvg2-bin jq

      - name: ShellCheck
        run: shellcheck scripts/*.sh

      # No resvg on the runner: build-icons.sh falls back to rsvg-convert.
      - name: Smoke test (web, og, ios, android)
        run: |
          work="$RUNNER_TEMP/smoke"
          mkdir -p "$work/public"
          cd "$work"
          bash "$GITHUB_WORKSPACE/scripts/init-project.sh" --example
          sed -i 's/^TARGETS=.*/TARGETS="web og ios android"/' icons/icon.env
          grep '^TARGETS=' icons/icon.env
          make icons
          make icons-check
